    <body>
        <header>
            <h1>Contact Us</h1>
            <p>Any plans to visit to Brunei leave your Contact information Here </p>
            <button class="theme-toggle" id="ThemeToggle" type="button">Dark mode</button>

        </nav>
    
        <main>
            <section id="Contact" class="Contact">
                <div class="contactbox">
                <form action="submitted.html" method= "get">
                <label for="fullname"> Full Name: </label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email"> Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="text"> What is your enquiry:</label>
                <input type="enquiry" id="enquiry" name="enquiry" required>

                <label for="text"> What is your message:</label>
                <textarea type="message" id="message" name="message" required></textarea>

                <div class="buttons">
                <input type="submit" value="Submit">
                <input type="reset" value="Clear">
                </div>
                
                </form>
                </div>
            </section>
        </main>
